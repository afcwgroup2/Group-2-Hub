<!doctype html>
<!--
  Cadet Group 2 Hub, version 2026.11.27 (also in Admin → Site health). This one file is the whole site.
  Read SETUP.md (first-time setup), HANDOVER.md (who holds what, new-term steps, recovery) and MAINTAINING.md (how to change things).
  Sections are marked with /* ===== NAME ===== */ comments; search for them with Ctrl+F.
  Who sees what is decided by a person's positions (Admin → Load the UMD) and enforced by firestore.rules.
  When you change firestore.rules, paste it into Firebase → Firestore → Rules → Publish in the same sitting as uploading this file.
-->

<style>
/* Layout: black masthead with a red/yellow stripe, tab rail, one wide working column. Same look as the CS-12 One Stop Shop. */
:root{
  /* Palette from the Group 2 patch: shield teal, "2" gold, deep navy thread. */
  --bg:#EDF2F3; --surface:#FFFFFF; --sunk:#E2E9EB; --line:#D2DCDF;
  --ink:#0D1B22; --muted:#55646B;
  --navy:#0B1A22; --sun:#F2C230; --teal:#1497A3; --teal-deep:#0D6670; --coral:#D3392F; --sky:#0D6670; --mint:#1B8F5A; --grape:#6D4FD8;
  --sun-soft:#FCF0C8; --coral-soft:#FADFDC; --sky-soft:#DAEEF0; --mint-soft:#D6EFE2; --grape-soft:#E9E4FC;
  --mast-sub:#A9C6CB; --mast-hover:rgba(255,255,255,.08);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:16px; --shadow:0 1px 2px rgba(13,27,34,.05),0 8px 24px -10px rgba(13,27,34,.16);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A1418; --surface:#122027; --sunk:#192A32; --line:#24373F;
  --ink:#E9F1F3; --muted:#9DB0B7; --navy:#071014; --sky:#5CC4CE; --teal-deep:#3FB2BD;
  --sun-soft:#3A3212; --coral-soft:#3D1D1A; --sky-soft:#12333A; --mint-soft:#103424; --grape-soft:#2A2350; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5); color-scheme:dark }}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--sky)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{position:sticky;top:0;z-index:5;background:linear-gradient(115deg,#0B1A22 0%,#0E3A42 62%,#12606A 100%);color:#fff;box-shadow:0 3px 0 var(--teal),0 6px 0 var(--sun),0 10px 24px -12px rgba(0,0,0,.5)}
.mast .top{display:flex;align-items:center;gap:14px;padding-block:12px 6px}
.mast-logo{flex:none;width:52px;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.mast h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,32px);margin:0;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.mast .sub{font-size:12px;color:var(--mast-sub);letter-spacing:.06em;text-transform:uppercase}
.mast .who{margin-left:auto;font-size:12px;text-align:right;color:var(--mast-sub);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.mast .who select{background:var(--mast-hover);color:#fff;border:1px solid #3a4352;border-radius:8px;padding:3px 6px;font-size:12px;max-width:260px}
.linkbtn{all:unset;cursor:pointer;color:var(--sky);text-decoration:underline;text-underline-offset:2px}
.mast .linkbtn{color:var(--mast-sub)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.staff{background:var(--sun);color:var(--navy)}
.pill.view{background:var(--mast-hover);color:#E6EBF2}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:thin}
nav.tabs button{flex:none;border:0;background:transparent;color:#E6EBF2;padding:7px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px}
nav.tabs button:hover{background:var(--mast-hover)}
nav.tabs button[aria-current="page"]{background:var(--sun);color:var(--navy)}
nav.tabs .badge{display:inline-block;margin-left:5px;background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
main{padding-block:22px 60px}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--sun-soft);border-color:transparent}
.banner.bad{background:var(--coral-soft);border-color:transparent}
.banner.info{background:var(--sky-soft);border-color:transparent}
.banner.ok{background:var(--mint-soft);border-color:transparent}
h2.pg{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,44px);margin:0 0 4px;letter-spacing:.005em;line-height:1.02;text-transform:uppercase;text-wrap:balance}
p.lede{margin:0 0 18px;color:var(--muted);max-width:72ch}
h3{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.1;margin:0 0 10px;letter-spacing:.01em;text-wrap:balance}
h4{margin:0 0 6px;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel{background:var(--surface);border:1px solid rgba(13,27,34,.06);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:inherit}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;box-shadow:0 2px 6px -2px rgba(13,102,112,.6)}
.btn.pri:hover{background:var(--teal-deep);filter:brightness(1.1)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.btn.ok{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.danger{color:var(--coral)}
.btn.sm{padding:3px 8px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f span.h{font-weight:400;color:var(--muted);font-size:12px}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
label.ck input{margin-top:3px;width:16px;height:16px;accent-color:var(--sky)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=email],input[type=url],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px 12px}
.fgrid .wide{grid-column:1/-1}
.tw{overflow-x:auto;border:1px solid rgba(13,27,34,.06);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{position:sticky;top:0;background:var(--sunk);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
table.t tr.grp td{background:linear-gradient(90deg,#0E3A42,#12606A);color:#fff;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--sunk)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.grey{background:var(--sunk);color:var(--muted)}
.chip.sun{background:var(--sun-soft);color:#8A5D00}
.chip.ok{background:var(--mint-soft);color:var(--mint)}
.chip.bad{background:var(--coral-soft);color:var(--coral)}
.chip.sky{background:var(--sky-soft);color:var(--sky)}
.chip.grape{background:var(--grape-soft);color:var(--grape)}
@media (prefers-color-scheme: dark){.chip.sun{color:var(--sun)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid rgba(13,27,34,.06);border-top:4px solid var(--teal);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.kpi:nth-child(2){border-top-color:var(--sun)} .kpi:nth-child(3){border-top-color:var(--coral)} .kpi:nth-child(4){border-top-color:var(--teal-deep)}
.kpi:hover{transform:translateY(-2px)}
.kpi:hover{border-color:var(--sky)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);min-width:0}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;background:var(--coral-soft);border-radius:8px;padding:3px 6px;font-size:13px}
details.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px}
details.box summary{cursor:pointer;font-weight:700}
.scope{display:flex;flex-wrap:wrap;gap:6px}
.scope .chip{font-size:12.5px;padding:3px 10px}
/* tasker cards */
.card{background:var(--surface);border:1px solid rgba(13,27,34,.06);box-shadow:var(--shadow);border-left:5px solid var(--teal);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.late{border-left-color:var(--coral)} .card.soon{border-left-color:var(--sun)} .card.done{border-left-color:var(--mint);opacity:.85}
.card .tt{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;overflow-wrap:anywhere}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px}
.sqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:4px}
.sqgrid .sq{border-radius:8px;padding:4px 6px;font-size:12px;font-weight:700;text-align:center;border:1px solid var(--line);background:var(--surface)}
.sqgrid .sq.Working{background:var(--sun-soft);border-color:transparent}
.sqgrid .sq.Done{background:var(--mint-soft);color:var(--mint);border-color:transparent}
.sqgrid .sq small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:2px 4px}
.cal .d{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:92px;padding:4px 5px;font-size:12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.cal .d.out{opacity:.4}
.cal .d.today{border:2px solid var(--sun)}
.cal .d .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ev{all:unset;cursor:pointer;display:block;border-radius:5px;padding:1px 5px;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--sky-soft);color:var(--ink)}
.ev.k-Training{background:var(--mint-soft)} .ev.k-Deadline{background:var(--coral-soft)} .ev.k-Silver{background:var(--grape-soft)} .ev.k-Plan{background:var(--sun-soft)}
.ev.shared::after{content:" ⇧";color:var(--muted)}
@media (max-width:640px){.cal .d{min-height:62px;font-size:10px}.ev{font-size:10px}.mast .who{display:none}}
/* builder */
.doccards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-bottom:16px}
.doccard{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.doccard b{font-family:var(--display);font-size:17px}
.doccard span{font-size:12.5px;color:var(--muted)}
.doccard[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.para{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.lock{max-width:460px;margin:30px auto;text-align:center}
.steps{margin:6px 0 0;padding-left:22px}
.steps li{margin:3px 0}
.timeline{list-style:none;margin:0;padding:0;border-left:3px solid var(--line)}
.timeline li{padding:4px 0 8px 12px;position:relative;font-size:13.5px}
.timeline li::before{content:"";position:absolute;left:-7px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--sky)}
.dialog{position:fixed;inset:0;background:rgba(6,8,11,.55);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.dialog>.panel{width:min(720px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.preline{white-space:pre-line}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* home hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:24px 26px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#1AB0BC 0%,#0F7480 38%,#0B3A44 75%,#0B1A22 100%);box-shadow:0 18px 40px -20px rgba(11,58,68,.7);border-bottom:5px solid var(--sun)}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--teal)}
.hero .patch{position:absolute;right:-30px;top:50%;transform:translateY(-50%) rotate(-8deg);height:250px;width:auto;opacity:.2;pointer-events:none}
.hero h2.pg{color:#fff;font-size:clamp(34px,5.4vw,56px);margin:6px 0 4px;position:relative}
.hero .eyebrow,.divhero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;font-weight:700}
.hero .scope .chip{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22)}
.hero .scope .chip.sun{background:var(--sun);color:var(--navy);border-color:var(--sun)}
/* A-Staff */
.divtabs{display:flex;gap:6px;flex-wrap:wrap}
.divtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.divtabs button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--dc)}
.divtabs button[aria-selected="true"]{background:var(--dc);border-color:var(--dc);color:#fff}
.divtabs button[aria-selected="true"]::before{background:#fff}
.divtabs .badge{background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
.divhero{border-radius:20px;padding:20px 22px;color:#fff;background:linear-gradient(120deg,color-mix(in srgb,var(--dc) 88%,#000) 0%,var(--dc) 55%,color-mix(in srgb,var(--dc) 70%,#fff) 100%);box-shadow:0 16px 36px -22px var(--dc);display:flex;flex-direction:column;gap:14px}
.divhero h2.pg{color:#fff}
.divhero .seg{background:rgba(255,255,255,.18)} .divhero .seg button{color:#fff} .divhero .seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.roster .rs{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.25;min-width:0}
.roster .rs b{display:block;font-family:var(--display);font-size:15px;letter-spacing:.03em}
.roster .rs span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster .rs.vac{opacity:.6}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bcell{all:unset;cursor:pointer;border-radius:12px;padding:10px;background:var(--sunk);display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.bcell b{font-family:var(--display);font-size:20px}
.bcell span{font-size:12px;font-weight:600;color:var(--muted)}
.bcell.s-Approved{background:var(--mint-soft);border-color:transparent} .bcell.s-Approved span{color:var(--mint)}
.bcell.s-Returned{background:var(--coral-soft);border-color:transparent} .bcell.s-Returned span{color:var(--coral)}
.bcell.s-SenttoGroup,.bcell.s-GroupCoSreview,.bcell.s-GroupCCreview,.bcell.s-WithPPAOC{background:var(--sun-soft);border-color:transparent}
.bcell.s-Drafted,.bcell.s-Insquadronreview{background:var(--grape-soft);border-color:transparent}
.datebox{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--sky-soft);padding:4px 0;line-height:1}
.datebox b{display:block;font-family:var(--display);font-size:22px;color:var(--teal-deep)} .datebox small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.rt-wrap{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rt-h{margin:10px 0 0;color:var(--teal-deep);font-size:13px} .rt-wrap .rt-h:first-child{margin-top:0}
ul.rt{margin:0;padding-left:20px} ul.rt li{margin:3px 0} .rt-p{margin:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:0}
td.num{text-align:right;}
.bar{height:8px;background:var(--sunk);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--mint))}
ol.objlist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px} ol.objlist li{padding-left:4px}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin-top:12px}
.invcard{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--surface)}
.invcard img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:10px;flex:none}

<body>
<header class="mast">
  <div class="wrap">
    <div class="top">
      <img class="mast-logo" src="logo.png" alt="Cadet Group 2">
      <div><h1>Cadet Group 2 Hub</h1><div class="sub" id="mastsub">Group 2 · Squadrons 11–20</div></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div id="dlg"></div>
<div id="toast" class="toast" hidden></div>
<script>
"use strict";
/* ================= HELPERS ================= */
function h(tag,a,...kids){
  const el=document.createElement(tag);
  if(a) for(const k in a){ const v=a[k]; if(v==null||v===false) continue;
    // double-click protection: a button whose click handler returns a promise stays disabled until it finishes
    if(k==='onclick'&&tag==='button') el.addEventListener('click',ev=>{ if(el.dataset.busy) return; const r=v(ev); if(r&&typeof r.then==='function'){ el.dataset.busy='1'; el.disabled=true; r.catch(e=>console.warn(e)).finally(()=>{ delete el.dataset.busy; el.disabled=false; }); } });
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    // links from stored data: only http(s), mailto, tel or the site's own files; images only as data:image/(jpeg|png|webp)
    else if(k==='href'){ const u=String(v).trim(); el.setAttribute('href',/^(https?:|mailto:|tel:|#|[\w./-]+$)/i.test(u)&&!/^\s*(javascript|data|vbscript):/i.test(u)?u:'#'); }
    else if(k==='src'&&tag==='img'){ const u=String(v).trim(); if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)||/^[\w./-]+$/.test(u)||/^https:\/\//.test(u)) el.setAttribute('src',u); }
    else if(k==='class') el.className=v; else if(k==='style') el.style.cssText=v;
    else if(k==='value') el.value=v; else if(k==='checked') el.checked=!!v; else if(k==='selected') el.selected=!!v;
    else el.setAttribute(k,v===true?'':v); }
  add(el,kids); return el; }
function add(el,kids){ for(const k of kids){ if(k==null||k===false) continue; if(Array.isArray(k)) add(el,k); else el.append(k instanceof Node?k:document.createTextNode(String(k))); } }
const $=s=>document.querySelector(s);
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }
function ls(k,v){ try{ if(v===undefined){ const s=localStorage.getItem('g2:'+k); return s?JSON.parse(s):null; } localStorage.setItem('g2:'+k,JSON.stringify(v)); }catch(e){ return null; } }
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=MONTHS.map(m=>m.slice(0,3));
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
function fmtShort(s){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return `${pad(d)} ${MON3[m-1]} ${String(y).slice(2)}`; }
const localDay=s=>{ if(!s) return ''; const d=new Date(s); return isNaN(d)?String(s).slice(0,10):iso(d); };
const daysTo=s=>s?Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5):null;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function confirmBtn(label,onYes,cls='btn sm danger'){ const w=h('span'); const b=h('button',{class:cls,type:'button',onclick:()=>w.replaceChildren(h('span',{class:'confirm'},'Sure? ',h('button',{class:'btn sm danger',type:'button',onclick:onYes},'Yes'),h('button',{class:'btn sm',type:'button',onclick:()=>w.replaceChildren(b)},'No')))},label); w.append(b); return w; }
function dueChip(due,done){ if(!due) return h('span',{class:'chip grey'},'No suspense'); const n=daysTo(due); if(done) return h('span',{class:'chip ok'},'Due '+fmtShort(due));
  return h('span',{class:'chip '+(n<0?'bad':n<=3?'sun':'grey')},n<0?`${-n}d late · ${fmtShort(due)}`:n===0?'Due today':`Due ${fmtShort(due)} · ${n}d`); }

/* ================= UNITS, DIVISIONS, POSITIONS =================
   A position ("post") is written UNIT:CODE, for example  G2:CC  (Group Commander),  CS20:A46  (CS20 A4/6 Division Chief),
   G2:FS (Group First Sergeant).  Command codes (CC, CD, CoS, SEL, EX, SUPT) see everything in their unit.  Division codes see their
   division in their unit; at Group (G2) they see that division in every squadron.  Names can be changed in Admin → Site settings. */
const GROUP='G2';
const DEFAULT_UNITS=['G2','CS11','CS12','CS13','CS14','CS15','CS16','CS17','CS18','CS19','CS20'];
const CMD=[['CC','Commander'],['CD','Deputy'],['CoS','Chief of Staff'],['SEL','Senior Enlisted Leader'],['EX','Executive Officer'],['SUPT','Staff Superintendent']];
const CMD_CODES=CMD.map(c=>c[0]);
const DEFAULT_DIVS=[['A1','A1'],['A2','A2'],['A3','A3'],['A46','A4/6'],['SE','Stan/Eval'],['FS','First Sergeant']];
const CFG_DEFAULT={term:'Spring 2027',units:DEFAULT_UNITS,divs:DEFAULT_DIVS,indorser:{from:'AFCW/CG02/Commander',sig1:'DAVID A. HABBEN, Col, USAF',sig2:'Commander'},links:[]};
const cfg=()=>Object.assign({},CFG_DEFAULT,(S.cfg||{}));
const UNITS=()=>cfg().units&&cfg().units.length?cfg().units:DEFAULT_UNITS;
const SQS=()=>UNITS().filter(u=>u!==GROUP);
const DIVS=()=>cfg().divs&&cfg().divs.length?cfg().divs:DEFAULT_DIVS;
const divLabel=c=>/^P/.test(c)&&CMD.find(x=>x[0]===c.slice(1))?'Group '+CMD.find(x=>x[0]===c.slice(1))[1]:c==='ALL'?'All divisions':c==='CC'?'Squad Coms':c==='COS'?'Chiefs of Staff':c==='SEL'?'SELs':c==='CMD'?'Command staff':(DIVS().find(d=>d[0]===c)||[c,c])[1];
const unitLabel=u=>u===GROUP?'Group 2':u==='ALL'?'All squadrons':u;
function postLabel(p){ const [u,c]=String(p).split(':'); const cmd=CMD.find(x=>x[0]===c);
  const who=u===GROUP?'Group':u; if(cmd) return `${who} ${cmd[1]}`; if(c==='FS') return `${who} First Sergeant`; return `${who} ${divLabel(c)} Division Chief`; }
// everything the rules look at, worked out from the list of posts (saved on the person's access record by an admin)
function derive(posts){ posts=[...new Set((posts||[]).filter(p=>/^[A-Za-z0-9]+:[A-Za-z0-9]+$/.test(p)))];
  const cmdUnits=[],unitDivs=[],divs=[],units=[],gDivs=[];
  posts.forEach(p=>{ const [u,c]=p.split(':'); if(!units.includes(u)) units.push(u);
    if(CMD_CODES.includes(c)){ if(!cmdUnits.includes(u)) cmdUnits.push(u); }
    else { unitDivs.push(u+':'+c); if(!divs.includes(c)) divs.push(c); if(u===GROUP&&!gDivs.includes(c)) gDivs.push(c); } });
  return {posts,cmdUnits,unitDivs,divs,units,gDivs}; }

/* ---- who sees what (the same logic as firestore.rules, so the screen never shows less or more than the database allows) ---- */
const ME=()=>S.me||derive([]);
const isGroupCmd=(m=ME())=>m.cmdUnits.includes(GROUP);
// Group sees a squadron's taskers and paperwork only when Group sent them or the squadron sent them up (up == true).
function groupLane(d,m=ME()){ return (isGroupCmd(m)||m.gDivs.includes(d.div))&&(d.sq==='ALL'||d.sq===GROUP||d.up===true); }
function canSeeItem(d,m=ME()){ const {sq,div}=d;
  return groupLane(d,m) || m.cmdUnits.includes(sq) || m.unitDivs.includes(sq+':'+div)
    || (div==='ALL'&&m.units.includes(sq))
    || (sq==='ALL'&&(div==='ALL'||m.divs.includes(div)||m.cmdUnits.length>0)); }
function canSeeCal(d,m=ME()){ const {sq,div}=d;
  return m.cmdUnits.includes(sq) || m.unitDivs.includes(sq+':'+div) || (div==='ALL'&&m.units.includes(sq))
    || (d.up===true&&(isGroupCmd(m)||m.gDivs.includes(div))) || d.pub===true; }
// may this person create a record for UNIT / DIVISION?
function canWrite(sq,div,m=ME()){ if(isGroupCmd(m)) return true;
  if(sq==='ALL') return div!=='ALL'&&m.gDivs.includes(div);
  if(m.cmdUnits.includes(sq)) return true;
  return div!=='ALL'&&m.unitDivs.includes(sq+':'+div); }
// taskers come from Group only: Group command staff (incl. the Staff Superintendent) anywhere, a Group division chief in their division.
// Squadrons answer taskers; they don't post them.
/* Which tasker audiences each Group job oversees (posts, reviews, sees on the Taskers tab):
   Group CC, Deputy and Exec: everything. Group SEL: Squadron Commanders and SELs. Group CoS and Staff Supt: A-Staff
   (every division, plus all-leadership taskers). Group First Sergeant: First Sergeants. A Group division chief: their division. */
const gCodes=(m=ME())=>m.posts.filter(p=>p.startsWith(GROUP+':')).map(p=>p.split(':')[1]);
const staffDivs=()=>DIVS().map(d=>d[0]).filter(c=>c!=='FS');
function taskAudiences(m=ME()){ const c=gCodes(m), A=new Set(), st=staffDivs();
  if(c.some(x=>['CC','CD','EX'].includes(x))) ['CC','SEL','COS','FS',...st].forEach(x=>A.add(x));
  if(c.includes('SEL')) ['CC','SEL'].forEach(x=>A.add(x));
  if(c.some(x=>['CoS','SUPT'].includes(x))) ['COS',...st].forEach(x=>A.add(x));
  c.filter(x=>x==='FS'||st.includes(x)).forEach(x=>A.add(x));
  return ['CC','SEL','COS','FS',...st].filter(x=>A.has(x)); }
/* Group staff a person can task (sq = G2). Division chiefs and the Group First Sergeant use their division code; Group
   command positions use "P"+code (PCC, PCD, PCoS, PSEL, PEX, PSUPT).
   Group CC, Deputy, CoS: Group command staff, the Group First Sergeant and every Group division chief.
   Group Staff Supt: every Group division chief. */
function groupTargets(m=ME()){ const c=gCodes(m), A=[], st=staffDivs();
  if(c.some(x=>['CC','CD','CoS'].includes(x))) A.push(...CMD.map(x=>'P'+x[0]),'FS');
  if(c.some(x=>['CC','CD','CoS','SUPT'].includes(x))) A.push(...st);
  return [...new Set(A)]; }
const audLabel=c=>({CC:'Squad Coms',SEL:'SELs',COS:'Chiefs of Staff',FS:'First Sergeants'})[c]||divLabel(c);
const groupLabel=c=>c==='FS'?'Group First Sergeant':/^P/.test(c)?divLabel(c):`Group ${divLabel(c)} chief`;
const seesAllAStaff=(m=ME())=>gCodes(m).some(x=>['CC','CD','EX','CoS','SUPT'].includes(x));
// Group people holding a post (for picking a lead when a Group division has two chiefs)
const holders=post=>(S.dir.people||[]).filter(p=>(p.posts||[]).includes(post));
function canCreateTask(sq,div,m=ME()){ return sq===GROUP?groupTargets(m).includes(div):taskAudiences(m).includes(div); }
const taskUnits=(m=ME())=>[...(taskAudiences(m).length?['ALL',...SQS()]:[]),...(groupTargets(m).length?[GROUP]:[])];
const taskDivs=(u,m=ME())=>u===GROUP?groupTargets(m).map(c=>[c,groupLabel(c)]):taskAudiences(m).map(c=>[c,audLabel(c)]);
const canManageTask=t=>t.own===S.uid||(t.sq===GROUP?groupTargets().includes(t.div):taskAudiences().includes(t.div));
// the units a person can write into, and the divisions they can pick for a unit
function writeUnits(m=ME()){ const all=['ALL',...UNITS()]; return all.filter(u=>DIVS().some(([c])=>canWrite(u,c,m))||canWrite(u,'ALL',m)); }
function writeDivs(u,m=ME()){ return [['ALL','All divisions'],['CC','Command staff only'],...DIVS()].filter(([c])=>canWrite(u,c,m)); }
// units whose calendar this person can open
function calUnits(m=ME()){ if(isGroupCmd(m)) return UNITS(); const set=new Set(m.units); if(m.gDivs.length) SQS().forEach(u=>set.add(u)); return UNITS().filter(u=>set.has(u)); }
function scopeChips(m=ME()){ const out=[];
  if(isGroupCmd(m)) out.push(['Group 2 and every squadron: everything','sun']);
  m.gDivs.forEach(c=>out.push([`${divLabel(c)} across Squadrons 11–20`,'sky']));
  m.cmdUnits.filter(u=>u!==GROUP).forEach(u=>out.push([`${u}: everything`,'grape']));
  m.unitDivs.filter(x=>!x.startsWith(GROUP+':')&&!m.cmdUnits.includes(x.split(':')[0])).forEach(x=>{ const [u,c]=x.split(':'); out.push([`${u}: ${divLabel(c)}`,'ok']); });
  if(!out.length) out.push(['Group-wide announcements only','grey']);
  return out; }

/* ================= APP STATE ================= */
const S={deep:null,tab:'home',sub:ls('sub')||{},edit:{},me:null,isAdmin:false,email:'',uid:'',name:'',items:new Map(),cal:new Map(),acks:new Map(),dir:{people:[]},cfg:null,forms:null,ready:false,demo:false,pending:false};
function myName(){ const p=S.dir.people.find(x=>norm(x.email)===norm(S.email)); return (p&&p.name)||S.name||S.email; }
function personFor(post){ return S.dir.people.filter(p=>(p.posts||[]).includes(post)); }

/* ================= DATA LAYER =================
   Every record: {sq, div, t, up, pub, k, j, by, own, at}. sq/div/up/pub decide who can read it (see firestore.rules).
   j holds the rest as one JSON string. Collections: items (taskers + paperwork), cal (calendar), acks (squadron replies
   to taskers), files + fileparts (attachments, split into pieces because the free plan has no file storage),
   config (site settings, forms library), directory (who holds which job), members (access list, admin only), requests. */
/* ---- shape guard: repair a loaded record to the shape the tabs expect, so one bad record can't break a tab ---- */
const SHAPE_STR=['title','details','due','date','end','status','note','loc','doc','fromPost','fromName','task','week','lead','leadName','link','who','when','from','to','name','text','event','handled','created','fund','kind','by'];
const SHAPE_ARR=['lines','files','people','list','items','booked','objectives','timeline','stw','units','divs','posts'];
const SHAPE_OBJ=['levels','q','indorser'];
function fixShape(o){ if(!o||typeof o!=='object'||Array.isArray(o)) return {};
  SHAPE_STR.forEach(k=>{ if(k in o&&o[k]!=null&&typeof o[k]!=='string') o[k]=typeof o[k]==='number'?String(o[k]):''; });
  SHAPE_ARR.forEach(k=>{ if(k in o&&!Array.isArray(o[k])) o[k]=[]; });
  SHAPE_ARR.forEach(k=>{ if(Array.isArray(o[k])&&k!=='units'&&k!=='posts'&&k!=='divs') o[k]=o[k].filter(x=>x&&typeof x==='object'&&!Array.isArray(x)).map(fixShape); });
  ['units','posts'].forEach(k=>{ if(Array.isArray(o[k])) o[k]=o[k].filter(x=>typeof x==='string'); });
  if(Array.isArray(o.divs)) o.divs=o.divs.filter(x=>Array.isArray(x)&&typeof x[0]==='string'&&typeof x[1]==='string');
  SHAPE_OBJ.forEach(k=>{ if(k in o&&(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))) o[k]={}; });
  if('file' in o&&(o.file!==null&&(typeof o.file!=='object'||Array.isArray(o.file)))) o.file=null;
  return o; }
const DB={
  listeners:[], live:{},
  stop(){ this.listeners.forEach(u=>{ try{u()}catch(e){} }); this.listeners=[]; this.live={}; },
  dec(id,d){ if(!d) return null; let body={}; try{ body=JSON.parse(d.j||'{}'); }catch(e){} body=fixShape(body); const str=v=>typeof v==='string'?v:'';
    return {...body,id,sq:str(d.sq),div:str(d.div),t:str(d.t),up:!!d.up,pub:!!d.pub,k:str(d.k),by:d.by,own:d.own,at:d.at&&d.at.toMillis?d.at.toMillis():d.at}; },
  pack(rec){ const {id,sq,div,t,up,pub,k,by,own,at,...body}=rec; const j=JSON.stringify(body); if(j.length>900000) throw Object.assign(new Error('That record is too big.'),{code:'too-big'});
    return {sq,div,t:t||'',up:!!up,pub:!!pub,k:k||'',j,by:S.uid,own:own||S.uid,at:S.demo?Date.now():firebase.firestore.FieldValue.serverTimestamp()}; },
};
// which queries this person runs: one per slice they can see, so the database can prove each one is allowed
function itemScopes(m=ME()){ const q=[];
  if(isGroupCmd(m)){ q.push({sq:'ALL'},{up:true}); } else m.gDivs.forEach(d=>q.push({sq:'ALL',div:d},{up:true,div:d}));
  m.cmdUnits.forEach(u=>q.push({sq:u}));
  m.unitDivs.forEach(x=>{ const [u,d]=x.split(':'); if(!m.cmdUnits.includes(u)) q.push({sq:u,div:d}); });
  m.units.forEach(u=>{ if(!m.cmdUnits.includes(u)) q.push({sq:u,div:'ALL'}); });
  if(m.cmdUnits.length){ if(!isGroupCmd(m)) q.push({sq:'ALL'}); } else { m.divs.forEach(d=>{ if(!m.gDivs.includes(d)) q.push({sq:'ALL',div:d}); }); q.push({sq:'ALL',div:'ALL'}); }
  return q; }
function calScopes(m=ME()){ const q=[];
  m.cmdUnits.forEach(u=>q.push({sq:u}));
  m.unitDivs.forEach(x=>{ const [u,d]=x.split(':'); if(!m.cmdUnits.includes(u)) q.push({sq:u,div:d}); });
  m.units.forEach(u=>{ if(!m.cmdUnits.includes(u)) q.push({sq:u,div:'ALL'}); });
  if(isGroupCmd(m)) q.push({up:true}); else m.gDivs.forEach(d=>q.push({up:true,div:d}));
  q.push({pub:true}); return q; }

function listenColl(coll,scopes,mapRef,check){
  const buckets=scopes.map(()=>new Map());
  const merge=()=>{ mapRef.clear(); buckets.forEach(b=>b.forEach((v,k)=>{ if(check(v)) mapRef.set(k,v); })); schedule(); };
  if(S.demo){ DB.listeners.push(DEMO.listen(coll,()=>{ buckets[0].clear(); DEMO.all(coll).forEach(r=>buckets[0].set(r.id,r)); merge(); })); return; }
  scopes.forEach((sc,i)=>{ let q=FB.fs.collection(coll); for(const k in sc) q=q.where(k,'==',sc[k]); q=q.limit(600);
    DB.listeners.push(q.onSnapshot(qs=>{ buckets[i].clear(); qs.docs.forEach(d=>buckets[i].set(d.id,DB.dec(d.id,d.data()))); merge(); },e=>{ console.warn(coll,sc,e.code); if(e.code==='resource-exhausted') S.quota=true; schedule(); })); }); }

// transient errors (busy, offline blip) retry with growing, randomized waits; the daily quota (resource-exhausted) doesn't
const RETRY=new Set(['aborted','unavailable','deadline-exceeded','internal']);
async function withRetry(fn,tries=4){ for(let i=0;;i++){ try{ return await fn(); }catch(e){ if(e&&e.code==='resource-exhausted') S.quota=true; if(i>=tries-1||!(e&&RETRY.has(e.code))) throw e; await new Promise(r=>setTimeout(r,(300*2**i)*(0.6+Math.random()*0.8))); } } }
async function putRec(coll,rec){ if(!rec.id) rec.id=uid(); const data=DB.pack(rec);
  if(S.demo){ DEMO.put(coll,rec.id,data); return rec.id; }
  // own (the creator) rides along from the loaded record, so edits never change it; the rules check that too.
  // Each record belongs to one squadron/division, so whole-record saves don't collide; shared lists use mutateConfig.
  try{ await withRetry(()=>FB.fs.doc(coll+'/'+rec.id).set(data)); return rec.id; }
  catch(e){ dbErr(e); throw e; } }
async function delRec(coll,id){ if(S.demo){ DEMO.del(coll,id); return; } try{ await withRetry(()=>FB.fs.doc(coll+'/'+id).delete()); }catch(e){ dbErr(e); throw e; } }
function dbErr(e){ console.warn(e); toast(e&&e.code==='permission-denied'?'You don’t have permission to do that. Check your positions with a site admin.':e&&e.code==='too-big'?'That’s too big to save.':'That didn’t save. Check your connection and try again.'); }
async function putConfig(name,obj){ if(S.demo){ DEMO.cfg[name]=JSON.parse(JSON.stringify(obj)); DEMO.fire('config'); return; }
  try{ await withRetry(()=>FB.fs.doc('config/'+name).set({j:JSON.stringify(obj),by:S.uid,at:firebase.firestore.FieldValue.serverTimestamp()})); toast('Saved'); }catch(e){ dbErr(e); } }
// Change a shared settings record safely: read the newest copy, apply fn, save, all in one transaction, so two people
// editing the same list (helpful files, a library, the storage room) can't erase each other's work.
async function mutateConfig(name,fn){ const clone=x=>JSON.parse(JSON.stringify(x||{}));
  if(S.demo){ DEMO.cfg[name]=fn(clone(DEMO.cfg[name]))||DEMO.cfg[name]; DEMO.fire('config'); return; }
  try{ await withRetry(()=>FB.fs.runTransaction(async tx=>{ const ref=FB.fs.doc('config/'+name); const cur=await tx.get(ref); let v={}; try{ v=cur.exists?JSON.parse(cur.data().j||'{}'):{}; }catch(e){ v={}; }
      const next=fn(v)||v; tx.set(ref,{j:JSON.stringify(next),by:S.uid,at:firebase.firestore.FieldValue.serverTimestamp()}); })); toast('Saved'); }
  catch(e){ dbErr(e); throw e; } }
// add, replace or remove one entry of a list inside a settings record

/* ---- attachments: stored in pieces in the database (the free Firebase plan has no file storage). Up to 4 MB. ---- */
const PART=700000, MAX_FILE=4*1024*1024;
async function uploadFile(file,meta){ if(file.size>MAX_FILE){ toast('That file is over 4 MB. Put it in Teams/SharePoint and paste the link instead.'); return null; }

  const info={name:file.name.slice(0,140),type:file.type||'application/octet-stream',size:file.size,n};
  if(S.demo){ DEMO.files[id]={...base,info,b64}; return {id,...info}; }
  try{ for(let i=0;i<n;i++) await withRetry(()=>FB.fs.doc(`fileparts/${id}_${i}`).set({...base,d:b64.slice(i*PART,(i+1)*PART),at:firebase.firestore.FieldValue.serverTimestamp()}));
    await withRetry(()=>FB.fs.doc('files/'+id).set({...base,j:JSON.stringify(info),at:firebase.firestore.FieldValue.serverTimestamp()})); return {id,...info}; }
  catch(e){ dbErr(e); return null; } }

    else { const m=await FB.fs.doc('files/'+f.id).get(); if(!m.exists) return toast('That file was removed.'); info=JSON.parse(m.data().j);
      for(let i=0;i<info.n;i++){ const p=await withRetry(()=>FB.fs.doc(`fileparts/${f.id}_${i}`).get()); if(!p.exists) throw new Error('missing part'); b64+=p.data().d; } }
    const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    saveBlob(new Blob([u8],{type:info.type}),info.name); }
  catch(e){ console.warn(e); toast('Couldn’t open that file. You may not have access to it.'); } }

function linkChip(url){ if(!url) return null; const ok=/^https:\/\//i.test(url); return ok?h('a',{class:'btn sm',href:url,target:'_blank',rel:'noopener noreferrer'},'🔗 Open link'):h('span',{class:'small muted'},url); }

/* ---- lazy settings: a config record starts streaming the first time a tab asks for it (saves reads) ---- */

    e=>{ console.warn(n,e.code); if(e.code==='resource-exhausted') S.quota=true; schedule(); })); }

   (1) third-level paragraphs are block-indented under the parent's text. Indorsement: "1st Ind, AFCW/CG02/Commander" with

async function buildMemo(d){
  const doc=await PDFLib.PDFDocument.create(); const F=await pdfFonts(doc);

  const newPage=()=>{ page=doc.addPage([PW,PH]); pageNo++; y=72; page.drawText(String(pageNo),{x:PW/2-3,y:36,size:sz,font:F.t}); };
  const need=n=>{ if(y+n>PH-72) newPage(); };
  const text=(s,x,f=F.t)=>{ page.drawText(clean(s),{x,y:PH-(y+10),size:sz,font:f}); };
  let fn=0; const box=(val,x,w,lines,name)=>tf(doc,page,F.t,name||('Memo_'+(++fn)),x,y-1.5,w,lines*LH+2,val,{multi:lines>1,size:sz});
  const sw=s=>F.t.widthOfTextAtSize(s,sz);
  // wrap: first line starts at indentFirst, the rest at x1; one editable box per page-chunk
  const para=(s,x1,indentFirst)=>{ const m=clean(s).match(/^((?:\(?[0-9a-z]{1,2}[.)])\s{2})?(.*)$/s); const pre=m[1]||''; const words=m[2].split(/\s+/); let line=pre; let curW=RM-indentFirst; const out=[];
    for(const w of words){ const t=(line&&line!==pre)?line+' '+w:line+w; if(sw(t)<=curW||line===pre||!line) line=t; else { out.push(line); line=w; curW=RM-x1; } }
    if(line) out.push(line);

  const inline=(label,val)=>{ text(label,LM); const w0=sw(label); const n=Math.max(1,wrapText(val||' ',F.t,sz,W-w0).length); box(val,LM+w0,RM-LM-w0+6,n); y+=(n-1)*LH; };

      page.drawImage(seal,{x:30,y:PH-112,width:85,height:80}); page.drawImage(patch,{x:PW-30-80,y:PH-112,width:80,height:80});

function parsePost(text){ const t=String(text||'').trim(); const m=t.match(/^(G2|Group|CS\s?-?\d{1,2})[\s:]+(.+)$/i); if(!m) return null;
  let u=m[1].toUpperCase().replace(/[\s-]/g,''); if(u==='GROUP') u=GROUP; if(/^CS\d$/.test(u)) u='CS0'+u.slice(2);

  const cmd=CMD.find(([c,l])=>norm(c)===r||norm(l)===r)||(/^(commander|cc)$/.test(r)?CMD[0]:/^(deputy|cd|cv|vice)/.test(r)?CMD[1]:/^(exec|ex|executive)/.test(r)?CMD[4]:/^(supt|staff supt|staff superintendent|superintendent)$/.test(r)?CMD[5]:/^(cos|chief of staff)$/.test(r)?CMD[2]:/^(sel|senior enlisted)/.test(r)?CMD[3]:null);
  if(cmd) return u+':'+cmd[0]; if(/^(fs|first s(er)?g(eant|t)?|shirt)$/.test(r)) return u+':FS';
  if(/^(mae|a3 mae|a3 training|training)$/.test(r)&&DIVS().some(d=>d[0]==='A3')) return u+':A3';
  const dv=DIVS().find(([c,l])=>norm(c)===r||norm(l)===r||norm(l).replace(/\//g,'')===r.replace(/\//g,'')||norm(c)===r.replace(/\//g,'')); return dv?u+':'+dv[0]:null; }
async function bulkAdd(text){ const rows=new Map(); const bad=[];

    let name='',posts=[],ok=true; const ps=parts.filter(p=>!/^admin$/i.test(p));
    for(let i=0;i<ps.length;i++){ const one=parsePost(ps[i]); if(one){ posts.push(one); continue; } const two=i+1<ps.length?parsePost(ps[i]+' '+ps[i+1]):null; if(two){ posts.push(two); i++; continue; } if(!name) name=ps[i]; else ok=false; }
    if(!ok||!posts.length&&!admin){ bad.push(line); return; }
    const k=em.toLowerCase(); const r=rows.get(k)||{name:'',posts:[],admin:false}; r.name=r.name||name; r.posts.push(...posts); r.admin=r.admin||admin; rows.set(k,r); });

 ['all','2.1','Weapons Handling','The cadet can effectively handle an M4 training weapon, treating it as if it were a live weapon. The cadet utilizes proper carry techniques, muzzle awareness, and safe handling procedures during movement and tactical scenarios, ensuring positive weapon accountability and zero unsafe handling incidents.'],
 ['all','2.2','Radio Operation','The cadet can effectively operate a Land Mobile Radio (LMR) and PRC-163 radio and program a plain text, line-of-sight frequency into a PRC-163 radio without assistance. The cadet transmits clear, concise messages using proper radio procedures, pro-words, and the phonetic alphabet, ensuring each message is received and acknowledged.'],
 ['all','2.3','Small Unmanned Aerial System (sUAS) Operation','The cadet can effectively operate a Teal 2 drone without assistance. The cadet properly powers on, charges, and operates the system; identifies and understands controller functions; and safely executes takeoff, basic flight maneuvers, camera/sensor operation, and landing procedures.'],
 ['all','2.4','Land Navigation','The cadet can independently navigate from a designated start point to an assigned objective using a Military Grid Reference System (MGRS) map, compass, and protractor. The cadet also demonstrates the ability to navigate along a route using terrain association.'],
 ['all','2.5','Tactical Combat Casualty Care (TCCC)','The cadet can effectively conduct a TCCC rapid casualty assessment using the MARCH (Massive hemorrhage-Airway-Respiration-Circulation-Hypothermia/Head injury) sequence, identifying and prioritizing life-threatening injuries, and applying the appropriate intervention. The cadet uses individual movement techniques or can work with a team/collapsable litter to transport a casualty.'],
 ['all','2.6','Security/Defensive Operations','The cadet can effectively contribute to a coordinated 360-degree defensive posture by understanding and executing their assigned sector of responsibility, maintaining continuous observation, employing mutual support with adjacent positions, and reporting relevant information promptly. The cadet synchronizes individual security actions within the flight/element force-protection plan, executes assigned priorities of work to improve and sustain the defensive position, and follows the established work/rest cycle to maintain readiness and security.'],
 ['all','2.7','Tactical Movement','The cadet can execute a tactical movement plan from a designated start point to an objective. The cadet integrates into the assigned formation, maintains proper spacing and accountability, uses cover and concealment appropriate to terrain and threat conditions, communicates relevant information, and follows movement requirements while minimizing detection. The cadet demonstrates the ability to execute assigned actions promptly and correctly.'],
 ['lead','3.1','Troop Leading Procedures','The cadet leader can independently execute Troop Leading Procedures to translate a mission tasking into a clear, executable plan. The cadet leader can develop and issue a complete five-paragraph Operations Order (OPORD) using visual aids, communicate commander’s intent, and verify subordinate understanding through back-briefs, enabling decentralized execution.'],
 ['lead','3.2','Pre-Combat Checks','The cadet leader can effectively conduct systematic pre-combat checks to verify personnel accountability, equipment serviceability, and training weapon accountability against established requirements. The cadet leader ensures all deficiencies and discrepancies are identified, corrected or reported before departure, ensuring each Element/Flight/Squadron is fully prepared and mission ready.'],
 ['lead','3.3','Radio Communications','The cadet leader can effectively establish and maintain radio communications with their team and higher headquarters (HHQ) to provide timely, accurate updates on the formation’s location, status, activities, mission progress, and identified threats. The cadet leader develops and implements a PACE (Primary-Alternate-Contingency-Emergency) communications plan to ensure uninterrupted information flow when primary communications fail. Threat reports are transmitted using the SALUTE format (Size, Activity, Location, Unit/Uniform, Time, and Equipment) to provide HHQ and subordinate elements with accurate, actionable information. All transmissions use proper radio procedures and formats, are acknowledged by the intended station, and enable team coordination, HHQ situational awareness, operational synchronization, and the timely dissemination of guidance throughout the field training exercise.'],
 ['lead','3.4','sUAS Employment and Operation','The cadet leader can effectively task a sUAS operator and integrate Teal 2 drone(s) to observe terrain, identify potential threats, and enhance situational awareness in support of ground force operations. Relevant information is accurately and promptly communicated to the ground force commander to inform tactical decisions and support mission execution.'],
 ['lead','3.5','React to Contact','The cadet leader can effectively lead the response to enemy contact, including small-arms, indirect-fire, and sUAS attacks. The cadet leader promptly reports contact, directs immediate protective actions and return fire as appropriate, maintains accountability and situational awareness, and maneuvers the element to break contact or close with and destroy the enemy. The cadet leader communicates clear instructions, adjusts actions as conditions change, and prepares the element to execute follow-on actions once the threat is neutralized.'],
 ['lead','3.6','Security/Defensive Operations','The cadet leader can establish and maintain a coordinated 360-degree defensive posture by assigning and confirming sectors of responsibility, directing continuous observation, and positioning personnel for mutual support. The cadet leader synchronizes security measures with adjacent Elements/Flights/Squadrons, maintains accountability and situational awareness, and communicates changes to the defensive posture as required. The cadet leader directs and supervises priorities of work to improve and sustain the defensive position and establishes a work/rest cycle that preserves personnel readiness and continuous security.'],
 ['lead','3.7','Tactical Movement','The cadet leader can plan, brief, and direct tactical movement from a designated start point to an objective. The cadet leader selects appropriate formations, directs personnel to maintain proper spacing and accountability, and employs cover and concealment based on terrain and threat conditions. The cadet leader clearly communicates movement requirements, maneuvers the element while minimizing detection, maintains situational awareness throughout movement, and ensures all personnel understand and execute the plan.'],
 ['lead','3.8','Mass Casualty (MASCAL) Response','The cadet leader can rapidly recognize and declare a MASCAL event, establish a tactically sound Casualty Collection Point (CCP), and direct pre-designated teams to execute their assigned roles. The cadet leader supervises the systematic triage of casualties by priority, ensures transmission of an accurate and consolidated 9-Line Medical Evacuation (MEDEVAC) request, maintains security and personnel accountability, and coordinates casualty evacuation while sustaining command and control of the element.'],

/* ================= ACCESS: the UMD roster and claiming a job =================
   Admins paste the UMD; every row with a position the site uses becomes a roster record roster/{post__first-last}
   holding that job's access fields. People sign in with any Google account, type their name and pick their job; if
   that opens a roster record that isn't claimed yet, they copy its access onto their own record and claim it. No

const RANKS=/^(c[1-4]c|cadet|cdt|c\/?col|c\/?lt\s?col|c\/?maj|c\/?capt|c\/?1st\s?lt|c\/?2nd\s?lt|c\/?cmsgt|c\/?smsgt|c\/?msgt|c\/?tsgt|c\/?ssgt|c\/?sra|c\/?a1c|c\/?amn)$/;

function normName(n){ let t=String(n||'').toLowerCase().replace(/[’']/g,'');
  if(t.includes(',')){ const [last,rest]=t.split(',',2); t=(rest||'')+' '+last; }
  const w=t.replace(/[^a-z\s-]/g,' ').split(/\s+/).map(x=>x.replace(/^-+|-+$/g,'')).filter(x=>x&&!RANKS.test(x)&&x.length>1&&!/^(jr|sr|ii|iii|iv)$/.test(x));
  return w.length?(w.length===1?w[0]:w[0]+'-'+w[w.length-1]):''; }

async function claimJob(name,post){ const id=slotId(post,name); if(!id) return {err:'Type your first and last name.'};

  const b=FB.fs.batch(); b.set(me,{name:r.name,role:'member',posts:r.posts,cmdUnits:r.cmdUnits,unitDivs:r.unitDivs,divs:r.divs,units:r.units,gDivs:r.gDivs,slot:id,claimedAt:at}); b.update(slot,{claimedBy:S.email,claimedAt:at});
  try{ await withRetry(()=>b.commit()); return {ok:true}; }catch(e){ console.warn(e); return {err:e.code==='permission-denied'?'taken':'net'}; } }
/* No header row (the Group 2 UMD as copied from Excel): each row is
   Position · Class · Rank · Name · Squadron · Phone · Email, in any order. Cells are recognized by what they look like:
   class (C1C), rank (C/Col), squadron number, phone, email; the job is the first cell and the name is the other text cell.
   The job's unit: "Group …" → Group 2; "CS20 …"/"Squadron 20 …" → that squadron; otherwise the row's squadron number.
   Phone numbers and emails are never saved. */
function parseUmdLoose(rows){ const out=[]; let unit='';
  const isCls=c=>/^c[1-4]c$/i.test(c), isRank=c=>/^c\/\s?[a-z]/i.test(c)||/^(cadet|cdt)$/i.test(c), isEmail=c=>/@/.test(c), isSq=c=>/^(cs\s?-?)?\d{1,2}$/i.test(c), isPhone=c=>(c.replace(/\D/g,'').length>=7)&&/^[\d\s()+.-]+$/.test(c);

async function boot(){
  if(/[?&]demo\b/.test(location.search)) return startDemo();
  if(!fbConfigured()){ FB.state='out'; render(); return; }
  if(!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
  FB.auth=firebase.auth(); FB.fs=firebase.firestore();
  try{ await FB.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  try{ await FB.auth.getRedirectResult(); }catch(e){}
  let memberUnsub=null;
  FB.auth.onAuthStateChanged(async user=>{
    FB.user=user; if(memberUnsub){ memberUnsub(); memberUnsub=null; }
    if(!user){ FB.state='out'; S.signedIn=false; DB.stop(); render(); return; }
    const pwOnly=user.providerData.every(p=>p.providerId==='password');
    if(pwOnly&&!user.emailVerified){ FB.state='verify'; render(); return; }
    FB.state='checking'; render();
    S.email=user.email.toLowerCase(); S.uid=user.uid;
    // the first read right after sign-in can fail before the token settles: get a fresh token and try a few times
    let ok=false; for(let i=0;i<3&&!ok;i++){ try{ await user.getIdToken(i>0); await FB.fs.doc('members/'+S.email).get(); ok=true; }catch(e){ if(e.code==='permission-denied'&&i===2) ok=true; else await new Promise(r=>setTimeout(r,600*(i+1))); } }
    if(!ok){ FB.state='checkfail'; render(); return; }
    let lastKey='';
    memberUnsub=FB.fs.doc('members/'+S.email).onSnapshot(s=>{
      if(!s.exists){ FB.state='pending'; S.signedIn=false; DB.stop(); render(); return; }
      const d=s.data(); S.name=d.name||''; S.isAdmin=d.role==='admin'; S.me=derive(d.posts||[]);
      const key=JSON.stringify([S.me.posts,S.isAdmin]); FB.state='in'; S.signedIn=true;
      if(key!==lastKey){ lastKey=key; watchAdmin.on=false; startData(); if(S.isAdmin) watchAdmin(); }
      if(S.signedIn) idleWatch(); render(); },e=>{ console.warn(e); FB.state=e.code==='permission-denied'?'pending':'checkfail'; render(); });
  });
  readHash();
}
